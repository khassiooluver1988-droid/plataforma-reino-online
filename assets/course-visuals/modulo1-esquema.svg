<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">As quatro funções administrativas</title><desc id="desc">Planejar, organizar, dirigir e controlar formam um ciclo; os resultados realimentam o planejamento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">As quatro funções administrativas</text><rect x="60" y="85" width="260" height="100" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="190.0" y="128.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Planejar</text><text x="190.0" y="153.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Objetivo, meta e caminho</text><rect x="540" y="85" width="300" height="100" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="690.0" y="128.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Organizar</text><text x="690.0" y="153.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Pessoas, tarefas e recursos</text><rect x="540" y="265" width="300" height="100" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="690.0" y="308.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Dirigir</text><text x="690.0" y="333.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Orientar e acompanhar</text><rect x="60" y="265" width="260" height="100" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="190.0" y="308.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Controlar</text><text x="190.0" y="333.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Comparar meta e resultado</text><polyline points="320,135 540,135" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="690,185 690,265" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="540,315 320,315" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="190,265 190,185" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="222" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">O resultado orienta o próximo plano</text></svg>