<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1360" viewBox="0 0 900 1360" role="img" aria-labelledby="title desc"><title id="title">Percurso do aluno — REINO 02</title><desc id="desc">A capa apresenta o curso. Cada módulo contém aulas, imagens, práticas e 20 exercícios. Após os cinco módulos, prova final de 50 questões: 35 acertos liberam certificado; reprovação exige novo ciclo completo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">Percurso do aluno — REINO 02</text><rect x="240" y="80" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="126.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Capa e apresentação do curso</text><rect x="240" y="190" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="223.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Aulas do módulo</text><text x="450.0" y="248.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Explicações, imagens e exemplos</text><rect x="240" y="320" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="366.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Prática guiada e estudo de caso</text><rect x="240" y="430" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="476.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">20 exercícios com correção</text><rect x="240" y="540" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="586.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Protocolo do módulo</text><polyline points="450,160 450,190" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="450,270 450,300" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="450,400 450,430" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="450,510 450,540" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="450,650 650,710 450,770 250,710" fill="#fff5df" stroke="#b98728"/><text x="450" y="716" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold">Há outro módulo?</text><polyline points="450,620 450,650" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="650,710 805,710 805,230 660,230" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="725" y="698" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Sim</text><rect x="240" y="815" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="861.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Prova final: 50 questões</text><polyline points="450,770 450,815" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="505" y="800" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Não</text><rect x="240" y="935" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="981.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Correção e registro da nota</text><polyline points="450,895 450,935" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="450,1060 650,1120 450,1180 250,1120" fill="#fff5df" stroke="#b98728"/><text x="450" y="1126" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold">Nota igual ou maior que 7,0?</text><polyline points="450,1015 450,1060" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="240" y="1230" width="420" height="80" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="1276.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Protocolo final e certificado PDF</text><polyline points="450,1180 450,1230" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="603" y="1210" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Sim · 35 acertos ou mais</text><rect x="15" y="950" width="190" height="105" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="110.0" y="996.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Refazer o curso</text><text x="110.0" y="1021.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Histórico preservado</text><polyline points="250,1120 110,1120 110,1055" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="164" y="1103" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Não</text><polyline points="110,950 110,230 240,230" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/></svg>