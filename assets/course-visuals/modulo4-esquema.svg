<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Atendimento que acompanha a solução</title><desc id="desc">Ouvir, verificar, encaminhar e acompanhar; o registro permite continuidade e retorno ao cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">Atendimento que acompanha a solução</text><rect x="60" y="100" width="330" height="85" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="225.0" y="136.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Ouvir</text><text x="225.0" y="161.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Entender a necessidade</text><rect x="510" y="100" width="330" height="85" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="675.0" y="136.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Verificar</text><text x="675.0" y="161.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Conferir os fatos</text><rect x="510" y="280" width="330" height="85" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="675.0" y="316.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Encaminhar</text><text x="675.0" y="341.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Combinar responsável e prazo</text><rect x="60" y="280" width="330" height="85" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="225.0" y="316.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Acompanhar</text><text x="225.0" y="341.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Retornar e confirmar conclusão</text><polyline points="390,142 510,142" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="675,185 675,280" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="510,322 390,322" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="225,280 225,185" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="230" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Registrar cada etapa com clareza</text><text x="450" y="419" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Compartilhe apenas as informações necessárias.</text></svg>