<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Rotina com registro e acompanhamento</title><desc id="desc">Solicitação é registrada, conferida, executada e encerrada. Pendências retornam à conferência.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">Rotina com registro e acompanhamento</text><rect x="270" y="78" width="360" height="70" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="119.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Receber e registrar a solicitação</text><rect x="270" y="188" width="360" height="70" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="229.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Conferir dados, prazo e responsável</text><rect x="270" y="310" width="360" height="70" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="351.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Executar e acompanhar</text><rect x="270" y="430" width="360" height="70" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="471.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Conferir entrega e arquivar</text><rect x="20" y="310" width="210" height="90" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="125.0" y="348.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Pendência?</text><text x="125.0" y="373.5" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Pedir informação</text><polyline points="450,148 450,188" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="450,258 450,310" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="560" y="288" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Dados completos</text><polyline points="450,380 450,430" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="270,225 125,225 125,310" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="175" y="215" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal">Não</text><polyline points="125,400 125,520 690,520 690,225 630,225" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/></svg>