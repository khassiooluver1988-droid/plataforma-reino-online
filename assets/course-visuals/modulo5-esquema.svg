<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">PDCA: aprender com os resultados</title><desc id="desc">Planejar, executar, verificar e agir em ciclo para ajustar ou padronizar melhorias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">PDCA: aprender com os resultados</text><rect x="60" y="85" width="300" height="105" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="210.0" y="131.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">P — Planejar</text><text x="210.0" y="156.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Problema, causa, meta e teste</text><rect x="540" y="85" width="300" height="105" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="690.0" y="131.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">D — Executar</text><text x="690.0" y="156.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Realizar e registrar o teste</text><rect x="540" y="285" width="300" height="105" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="690.0" y="331.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">C — Verificar</text><text x="690.0" y="356.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Comparar resultado e meta</text><rect x="60" y="285" width="300" height="105" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="210.0" y="331.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">A — Agir</text><text x="210.0" y="356.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Ajustar ou padronizar</text><polyline points="360,138 540,138" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="690,190 690,285" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="540,338 360,338" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="210,285 210,190" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="245" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="bold">Melhoria com evidências</text><text x="450" y="443" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Se não funcionar, revise a hipótese e teste novamente.</text></svg>