<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Como calcular o saldo de caixa</title><desc id="desc">Saldo inicial de 2 mil mais entradas de 8 mil menos saídas de 7.200 resulta em saldo final de 2.800 reais.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#56738d"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="450.0" y="42" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="bold">Como calcular o saldo de caixa</text><rect x="40" y="90" width="240" height="95" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="160.0" y="131.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Saldo inicial</text><text x="160.0" y="156.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">R$ 2.000</text><text x="305" y="145" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="normal">+</text><rect x="330" y="90" width="240" height="95" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="450.0" y="131.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Entradas</text><text x="450.0" y="156.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">R$ 8.000</text><text x="595" y="145" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="normal">−</text><rect x="620" y="90" width="240" height="95" rx="12" fill="#edf4fa" stroke="#b6c9d9"/><text x="740.0" y="131.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Saídas</text><text x="740.0" y="156.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">R$ 7.200</text><rect x="290" y="235" width="320" height="95" rx="12" fill="#fff5df" stroke="#b6c9d9"/><text x="450.0" y="276.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">Saldo final</text><text x="450.0" y="301.0" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal">R$ 2.800</text><polyline points="450,185 450,235" fill="none" stroke="#56738d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="372" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold">Saldo de caixa não é automaticamente lucro.</text><text x="450" y="406" text-anchor="middle" fill="#173a5c" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal">Empréstimos, datas e investimentos também movimentam o caixa.</text></svg>