<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img"><title>Fundamentos do cuidado</title><defs><linearGradient id="bg"><stop stop-color="#071a34"/><stop offset="1" stop-color="#146b70"/></linearGradient></defs><rect width="1100" height="570" rx="24" fill="url(#bg)"/><circle cx="950" cy="70" r="160" fill="#ffffff" opacity=".05"/><text x="60" y="60" fill="#e5c16e" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">PLATAFORMA REINO · CUIDADO E BEM-ESTAR</text><text x="60" y="120" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="bold">Fundamentos do cuidado</text><text x="60" y="193" fill="#d9edf0" font-family="Arial,sans-serif" font-size="20">Reconhecer capacidades, direitos, responsabilidades e proteção da pessoa</text><text x="60" y="221" fill="#d9edf0" font-family="Arial,sans-serif" font-size="20">idosa.</text><rect x="60" y="330" width="320" height="150" rx="20" fill="#fff"/><circle cx="95" cy="365" r="20" fill="#e5c16e"/><text x="89" y="372" font-family="Arial,sans-serif" font-size="20" font-weight="bold">1</text><text x="80" y="410" fill="#071a34" font-family="Arial,sans-serif" font-size="19">Conhecer a pessoa e o</text><text x="80" y="435" fill="#071a34" font-family="Arial,sans-serif" font-size="19">plano</text><text x="386" y="419" fill="#e5c16e" font-family="Arial,sans-serif" font-size="24">→</text><rect x="410" y="330" width="320" height="150" rx="20" fill="#fff"/><circle cx="445" cy="365" r="20" fill="#e5c16e"/><text x="439" y="372" font-family="Arial,sans-serif" font-size="20" font-weight="bold">2</text><text x="430" y="410" fill="#071a34" font-family="Arial,sans-serif" font-size="19">Estudar, observar e</text><text x="430" y="435" fill="#071a34" font-family="Arial,sans-serif" font-size="19">praticar</text><text x="736" y="419" fill="#e5c16e" font-family="Arial,sans-serif" font-size="24">→</text><rect x="760" y="330" width="320" height="150" rx="20" fill="#fff"/><circle cx="795" cy="365" r="20" fill="#e5c16e"/><text x="789" y="372" font-family="Arial,sans-serif" font-size="20" font-weight="bold">3</text><text x="780" y="410" fill="#071a34" font-family="Arial,sans-serif" font-size="19">Registrar e comunicar</text><text x="60" y="530" fill="#d9edf0" font-family="Arial,sans-serif" font-size="16">Esquema didático. Técnicas práticas exigem orientação individual e treinamento supervisionado.</text></svg>