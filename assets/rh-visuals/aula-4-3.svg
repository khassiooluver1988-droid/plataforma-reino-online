<svg xmlns="http://www.w3.org/2000/svg" width="900" height="501" viewBox="0 0 900 501"><rect width="900" height="501" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Organização de treinamentos</text><text x="45" y="140" fill="#163349" font-size="18">1. Antes do treinamento, confira: Agenda, participantes,</text><text x="45" y="167" fill="#163349" font-size="18">materiais e acesso.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Lista de presença comprova: Participação registrada.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Acessibilidade no material busca: Ampliar condições de</text><text x="45" y="302" fill="#163349" font-size="18">participação.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. O canal de dúvidas deve ser: Conhecido pelos participantes.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Aplicação: O link não funciona para parte da equipe; uma</text><text x="45" y="437" fill="#163349" font-size="18">conferência prévia e um canal de suporte evitam perda de tempo.</text><text x="45" y="464" fill="#163349" font-size="18"></text></svg>