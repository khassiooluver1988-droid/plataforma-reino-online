<svg xmlns="http://www.w3.org/2000/svg" width="900" height="501" viewBox="0 0 900 501"><rect width="900" height="501" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Fluxos, responsáveis e checklists</text><text x="45" y="140" fill="#163349" font-size="18">1. Um fluxo deve identificar: Etapas, entradas, saídas e</text><text x="45" y="167" fill="#163349" font-size="18">responsáveis.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Um checklist serve para: Conferir etapas previstas.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Uma pendência precisa de: Responsável e prazo de</text><text x="45" y="302" fill="#163349" font-size="18">acompanhamento.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Quem aprova uma etapa? A pessoa autorizada no fluxo.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Aplicação: O recrutamento começa com uma solicitação aprovada,</text><text x="45" y="437" fill="#163349" font-size="18">segue para divulgação e termina com decisão registrada.</text><text x="45" y="464" fill="#163349" font-size="18"></text></svg>