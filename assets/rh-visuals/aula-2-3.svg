<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Triagem objetiva de currículos</text><text x="45" y="140" fill="#163349" font-size="18">1. A triagem deve comparar currículos com: Requisitos</text><text x="45" y="167" fill="#163349" font-size="18">previamente definidos.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Informação não encontrada deve ser: Sinalizada como não</text><text x="45" y="248" fill="#163349" font-size="18">confirmada.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Uma matriz de triagem ajuda a: Aplicar critérios de modo</text><text x="45" y="329" fill="#163349" font-size="18">consistente.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Experiência declarada em currículo é: Informação a verificar</text><text x="45" y="410" fill="#163349" font-size="18">na seleção.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: A vaga pede planilhas; a matriz registra experiência</text><text x="45" y="491" fill="#163349" font-size="18">declarada e deixa a comprovação para uma atividade prática.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>