<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Integração e acolhida do novo colaborador</text><text x="45" y="140" fill="#163349" font-size="18">1. A integração deve apresentar: Equipe, responsabilidades e</text><text x="45" y="167" fill="#163349" font-size="18">canais de ajuda.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Entregar um manual significa: Disponibilizar orientação que</text><text x="45" y="248" fill="#163349" font-size="18">precisa ser compreendida.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. O acesso aos sistemas deve seguir: Autorização e necessidade</text><text x="45" y="329" fill="#163349" font-size="18">da função.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. O acompanhamento após o primeiro dia ajuda a: Identificar</text><text x="45" y="410" fill="#163349" font-size="18">dúvidas e ajustar a integração.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: O novo colaborador recebe agenda, conhece o</text><text x="45" y="491" fill="#163349" font-size="18">responsável e pratica um registro acompanhado.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>