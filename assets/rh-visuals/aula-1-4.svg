<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Documentos e qualidade dos cadastros</text><text x="45" y="140" fill="#163349" font-size="18">1. Ao encontrar dois registros parecidos, faça: Conferência</text><text x="45" y="167" fill="#163349" font-size="18">antes de unir cadastros.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Uma informação ausente deve ser: Confirmada com fonte</text><text x="45" y="248" fill="#163349" font-size="18">autorizada.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Rastreabilidade de alteração permite saber: O que mudou,</text><text x="45" y="329" fill="#163349" font-size="18">quando e por quem.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Nas tarefas do curso, utilize: Dados fictícios.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Dois cadastros representam a mesma pessoa; antes de</text><text x="45" y="464" fill="#163349" font-size="18">unir, confirme a identidade e o procedimento.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>