<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Privacidade e segurança da informação</text><text x="45" y="140" fill="#163349" font-size="18">1. Qual prática reduz exposição de dados? Acesso limitado a</text><text x="45" y="167" fill="#163349" font-size="18">pessoas autorizadas.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. A coleta deve se limitar: Ao necessário para a finalidade.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Dados de saúde exigem: Cuidados específicos de proteção.</text><text x="45" y="302" fill="#163349" font-size="18"></text><text x="45" y="329" fill="#163349" font-size="18">4. Ao perceber envio incorreto, faça: Contenção e comunicação</text><text x="45" y="356" fill="#163349" font-size="18">pelo procedimento interno.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Aplicação: Uma planilha foi enviada ao destinatário errado.</text><text x="45" y="437" fill="#163349" font-size="18">Registre o ocorrido e acione o procedimento interno de</text><text x="45" y="464" fill="#163349" font-size="18">incidentes.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>