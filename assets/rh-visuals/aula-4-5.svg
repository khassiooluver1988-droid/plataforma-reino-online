<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Feedback e plano de desenvolvimento</text><text x="45" y="140" fill="#163349" font-size="18">1. Um feedback útil descreve: Comportamento observado e impacto.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. Um plano de desenvolvimento precisa de: Ação, prazo, apoio e</text><text x="45" y="221" fill="#163349" font-size="18">acompanhamento.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Ouvir o contexto ajuda a: Compreender fatores que influenciam</text><text x="45" y="302" fill="#163349" font-size="18">o resultado.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Qual frase é mais objetiva? Duas solicitações ficaram sem</text><text x="45" y="383" fill="#163349" font-size="18">prazo registrado.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Em vez de chamar alguém de desorganizado, cite duas</text><text x="45" y="464" fill="#163349" font-size="18">solicitações sem prazo e combine como registrar as próximas.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>