<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Apoio à folha e conferência de informações</text><text x="45" y="140" fill="#163349" font-size="18">1. O apoio do assistente à folha inclui: Conferir informações e</text><text x="45" y="167" fill="#163349" font-size="18">encaminhar divergências.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Competência identifica: O período a que a informação se</text><text x="45" y="248" fill="#163349" font-size="18">refere.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Uma entrada não aprovada deve ser: Sinalizada antes do</text><text x="45" y="329" fill="#163349" font-size="18">processamento.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Taxas e regras aplicáveis precisam de: Verificação atual pela</text><text x="45" y="410" fill="#163349" font-size="18">área responsável.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Uma informação de frequência não foi aprovada; o</text><text x="45" y="491" fill="#163349" font-size="18">assistente registra a pendência antes do processamento.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>