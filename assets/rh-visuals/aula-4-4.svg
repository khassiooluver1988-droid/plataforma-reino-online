<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Avaliação de treinamento e aplicação</text><text x="45" y="140" fill="#163349" font-size="18">1. Satisfação com o curso mede: Percepção do participante.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. Uma tarefa alinhada ao objetivo avalia: Aprendizagem</text><text x="45" y="221" fill="#163349" font-size="18">demonstrada.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. A aplicação deve ser acompanhada: Na rotina após o</text><text x="45" y="302" fill="#163349" font-size="18">treinamento.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Para comparar antes e depois, utilize: Critérios e períodos</text><text x="45" y="383" fill="#163349" font-size="18">comparáveis.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Uma atividade confirma que a pessoa aprendeu o</text><text x="45" y="464" fill="#163349" font-size="18">registro; semanas depois, a equipe verifica se reduziu os erros.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>