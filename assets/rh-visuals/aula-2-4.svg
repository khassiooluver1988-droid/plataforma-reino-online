<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Entrevista estruturada e evidências</text><text x="45" y="140" fill="#163349" font-size="18">1. Uma entrevista estruturada utiliza: Roteiro ligado às</text><text x="45" y="167" fill="#163349" font-size="18">competências da vaga.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Para obter evidência de organização, peça: Exemplo de</text><text x="45" y="248" fill="#163349" font-size="18">situação, ação e resultado.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Uma impressão do entrevistador deve ser: Diferenciada de</text><text x="45" y="329" fill="#163349" font-size="18">evidência observada.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. O mesmo roteiro básico favorece: Comparação consistente entre</text><text x="45" y="410" fill="#163349" font-size="18">candidatos.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Em vez de perguntar apenas se alguém é organizado,</text><text x="45" y="491" fill="#163349" font-size="18">peça um exemplo de como acompanhou três prazos simultâneos.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>