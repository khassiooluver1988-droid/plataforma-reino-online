<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Conflitos, respeito e encaminhamento</text><text x="45" y="140" fill="#163349" font-size="18">1. Ao receber relato delicado, priorize: Escuta e encaminhamento</text><text x="45" y="167" fill="#163349" font-size="18">ao canal responsável.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. O registro deve conter: Informações necessárias e fatos</text><text x="45" y="248" fill="#163349" font-size="18">identificados.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. O assistente deve prometer punição? Não; a apuração cabe aos</text><text x="45" y="329" fill="#163349" font-size="18">responsáveis.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Compartilhar o relato exige: Procedimento e acesso adequado.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Uma pessoa relata desrespeito. O assistente escuta,</text><text x="45" y="464" fill="#163349" font-size="18">informa o canal e registra apenas o necessário conforme</text><text x="45" y="491" fill="#163349" font-size="18">procedimento.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>