<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Admissão e checklist documental</text><text x="45" y="140" fill="#163349" font-size="18">1. Uma pendência documental deve ser: Registrada e acompanhada.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. A lista aplicável de documentos deve ser: Confirmada com a</text><text x="45" y="221" fill="#163349" font-size="18">área responsável.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. O assistente deve acompanhar: Conferência, responsáveis e</text><text x="45" y="302" fill="#163349" font-size="18">prazos.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Documento divergente exige: Verificação e correção</text><text x="45" y="383" fill="#163349" font-size="18">autorizada.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Falta um documento previsto no checklist. Registre a</text><text x="45" y="464" fill="#163349" font-size="18">pendência e confirme o próximo passo com a equipe responsável.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>