<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Objetivos e planejamento de aprendizagem</text><text x="45" y="140" fill="#163349" font-size="18">1. Qual é um objetivo observável? Registrar uma solicitação com</text><text x="45" y="167" fill="#163349" font-size="18">campos completos.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. O planejamento deve relacionar: Objetivo, prática e</text><text x="45" y="248" fill="#163349" font-size="18">avaliação.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. A duração prevista deve permitir: Estudo, prática e</text><text x="45" y="329" fill="#163349" font-size="18">verificação.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Uma prática adequada ao objetivo deve: Demonstrar a</text><text x="45" y="410" fill="#163349" font-size="18">habilidade esperada.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Objetivo: registrar uma solicitação com todos os</text><text x="45" y="491" fill="#163349" font-size="18">campos obrigatórios; a prática usa um caso fictício.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>