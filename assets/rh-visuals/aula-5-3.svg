<svg xmlns="http://www.w3.org/2000/svg" width="900" height="501" viewBox="0 0 900 501"><rect width="900" height="501" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Indicadores de RH e interpretação</text><text x="45" y="140" fill="#163349" font-size="18">1. 18 presentes de 20 inscritos representam: 90%.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. 24 presentes de 30 inscritos representam: 80%.</text><text x="45" y="221" fill="#163349" font-size="18"></text><text x="45" y="248" fill="#163349" font-size="18">3. Um indicador precisa informar: Definição, período, fonte e</text><text x="45" y="275" fill="#163349" font-size="18">base.</text><text x="45" y="302" fill="#163349" font-size="18"></text><text x="45" y="329" fill="#163349" font-size="18">4. Um indicador isolado prova a causa? Não; exige investigação</text><text x="45" y="356" fill="#163349" font-size="18">complementar.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Aplicação: 18 participantes presentes de 20 inscritos</text><text x="45" y="437" fill="#163349" font-size="18">representam 90% de adesão no critério didático definido.</text><text x="45" y="464" fill="#163349" font-size="18"></text></svg>