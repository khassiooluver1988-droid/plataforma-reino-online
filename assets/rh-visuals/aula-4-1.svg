<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582"><rect width="900" height="582" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Levantamento de necessidades de treinamento</text><text x="45" y="140" fill="#163349" font-size="18">1. Uma necessidade de treinamento deve partir de: Diferença</text><text x="45" y="167" fill="#163349" font-size="18">entre desempenho esperado e observado.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Uma ferramenta indisponível exige primeiro: Investigar e</text><text x="45" y="248" fill="#163349" font-size="18">resolver a disponibilidade.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Antes de definir o curso, identifique: A competência e as</text><text x="45" y="329" fill="#163349" font-size="18">evidências da necessidade.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Todo problema operacional é falta de treinamento? Não; pode</text><text x="45" y="410" fill="#163349" font-size="18">envolver processo ou recursos.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Erros no sistema podem vir de falta de conhecimento</text><text x="45" y="491" fill="#163349" font-size="18">ou de cadastro incorreto; investigue antes de contratar</text><text x="45" y="518" fill="#163349" font-size="18">treinamento.</text><text x="45" y="545" fill="#163349" font-size="18"></text></svg>