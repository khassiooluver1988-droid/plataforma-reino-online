<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582"><rect width="900" height="582" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">RH e departamento pessoal</text><text x="45" y="140" fill="#163349" font-size="18">1. Qual assunto está ligado ao desenvolvimento? Planejamento de</text><text x="45" y="167" fill="#163349" font-size="18">treinamento.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Uma divergência no demonstrativo deve ser encaminhada: Ao</text><text x="45" y="248" fill="#163349" font-size="18">responsável pela folha.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. A divisão entre RH e DP é: Organizada conforme a estrutura da</text><text x="45" y="329" fill="#163349" font-size="18">empresa.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Para encaminhar corretamente, primeiro identifique: O assunto</text><text x="45" y="410" fill="#163349" font-size="18">e a responsabilidade.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Uma dúvida sobre treinamento vai ao responsável pelo</text><text x="45" y="491" fill="#163349" font-size="18">desenvolvimento; uma divergência no demonstrativo vai à equipe</text><text x="45" y="518" fill="#163349" font-size="18">de folha.</text><text x="45" y="545" fill="#163349" font-size="18"></text></svg>