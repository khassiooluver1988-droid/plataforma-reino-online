<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582"><rect width="900" height="582" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Jornada, frequência e registros de ocorrências</text><text x="45" y="140" fill="#163349" font-size="18">1. Ao faltar uma marcação, faça: Verificação conforme</text><text x="45" y="167" fill="#163349" font-size="18">procedimento.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. O registro de ocorrência deve conter: Fato, data e</text><text x="45" y="248" fill="#163349" font-size="18">encaminhamento.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Uma mudança no registro exige: Procedimento autorizado e</text><text x="45" y="329" fill="#163349" font-size="18">rastreável.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Regras de compensação devem ser: Confirmadas para o vínculo e</text><text x="45" y="410" fill="#163349" font-size="18">normas aplicáveis.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Um registro de saída está ausente. O assistente</text><text x="45" y="491" fill="#163349" font-size="18">identifica a ocorrência e solicita conferência, sem inventar</text><text x="45" y="518" fill="#163349" font-size="18">horário.</text><text x="45" y="545" fill="#163349" font-size="18"></text></svg>