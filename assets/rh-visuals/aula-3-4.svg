<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582"><rect width="900" height="582" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Benefícios e atendimento de dúvidas</text><text x="45" y="140" fill="#163349" font-size="18">1. Antes de orientar uma adesão, confira: A política vigente e</text><text x="45" y="167" fill="#163349" font-size="18">os critérios aplicáveis.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. O atendimento deve informar: Canal e próximo passo</text><text x="45" y="248" fill="#163349" font-size="18">confirmado.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Uma dúvida fora da competência deve ser: Encaminhada ao</text><text x="45" y="329" fill="#163349" font-size="18">responsável.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Solicitações de benefícios devem ter: Registro e</text><text x="45" y="410" fill="#163349" font-size="18">acompanhamento.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Uma pessoa pergunta sobre adesão a benefício. O</text><text x="45" y="491" fill="#163349" font-size="18">assistente consulta a política vigente e informa o canal</text><text x="45" y="518" fill="#163349" font-size="18">autorizado.</text><text x="45" y="545" fill="#163349" font-size="18"></text></svg>