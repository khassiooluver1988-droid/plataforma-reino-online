<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Percurso do curso</text><text x="45" y="140" fill="#163349" font-size="18">1. Estudar cinco aulas com esquemas e exemplos.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. Desenvolver a atividade prática integradora.</text><text x="45" y="221" fill="#163349" font-size="18"></text><text x="45" y="248" fill="#163349" font-size="18">3. Resolver 20 exercícios e analisar a correção.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">4. Concluir os cinco módulos.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">5. Realizar a prova final de 50 questões.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">6. Com 35 acertos ou mais, baixar o certificado PDF.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">7. Em caso de reprovação, iniciar novo ciclo.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>