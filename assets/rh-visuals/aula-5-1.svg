<svg xmlns="http://www.w3.org/2000/svg" width="900" height="501" viewBox="0 0 900 501"><rect width="900" height="501" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Comunicação interna e escuta</text><text x="45" y="140" fill="#163349" font-size="18">1. Uma mensagem interna deve indicar: Propósito e ação esperada.</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">2. O público da mensagem deve ser: Quem precisa da informação.</text><text x="45" y="221" fill="#163349" font-size="18"></text><text x="45" y="248" fill="#163349" font-size="18">3. Confirmar entendimento significa: Verificar se a demanda foi</text><text x="45" y="275" fill="#163349" font-size="18">compreendida.</text><text x="45" y="302" fill="#163349" font-size="18"></text><text x="45" y="329" fill="#163349" font-size="18">4. Informação ainda não confirmada deve ser: Verificada antes da</text><text x="45" y="356" fill="#163349" font-size="18">divulgação.</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Aplicação: Uma mudança de agenda é enviada ao público afetado</text><text x="45" y="437" fill="#163349" font-size="18">com data, horário e ação necessária.</text><text x="45" y="464" fill="#163349" font-size="18"></text></svg>