<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555"><rect width="900" height="555" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Papel do assistente de RH</text><text x="45" y="140" fill="#163349" font-size="18">1. Qual tarefa cabe ao assistente? Organizar solicitações e</text><text x="45" y="167" fill="#163349" font-size="18">encaminhar responsáveis.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Antes de prometer uma promoção, é necessário: Confirmar</text><text x="45" y="248" fill="#163349" font-size="18">decisão com a autoridade responsável.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Como acompanhar uma solicitação? Registrar responsável,</text><text x="45" y="329" fill="#163349" font-size="18">situação e prazo.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. O atendimento de RH deve combinar: Respeito, clareza e</text><text x="45" y="410" fill="#163349" font-size="18">confidencialidade.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Uma pessoa pede mudança de função. O assistente</text><text x="45" y="491" fill="#163349" font-size="18">registra e encaminha ao responsável, sem prometer promoção.</text><text x="45" y="518" fill="#163349" font-size="18"></text></svg>