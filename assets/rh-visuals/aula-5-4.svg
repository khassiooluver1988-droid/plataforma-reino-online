<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Ferramentas digitais e organização de tarefas</text><text x="45" y="140" fill="#163349" font-size="18">1. Uma lista de tarefas deve conter: Responsável, prazo e</text><text x="45" y="167" fill="#163349" font-size="18">situação.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Duas cópias divergentes exigem: Definir fonte de referência e</text><text x="45" y="248" fill="#163349" font-size="18">conciliar.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Antes de compartilhar dados, confira: Finalidade, qualidade e</text><text x="45" y="329" fill="#163349" font-size="18">autorização.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. Validação de campos ajuda a: Reduzir entradas inconsistentes.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Duas equipes editam cópias diferentes; uma fonte de</text><text x="45" y="464" fill="#163349" font-size="18">referência e histórico de mudanças reduzem divergências.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>