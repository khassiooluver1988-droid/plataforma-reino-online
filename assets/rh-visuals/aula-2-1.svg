<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Descrição de cargos e perfil da vaga</text><text x="45" y="140" fill="#163349" font-size="18">1. A descrição do cargo deve apresentar: Atividades e requisitos</text><text x="45" y="167" fill="#163349" font-size="18">do trabalho.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. Um requisito essencial é: Necessário para executar a função.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Antes da divulgação, o perfil deve ser: Validado com o</text><text x="45" y="302" fill="#163349" font-size="18">responsável pela vaga.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Critérios de seleção devem ser: Relacionados às competências</text><text x="45" y="383" fill="#163349" font-size="18">da função.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Uma vaga de atendimento exige comunicação e registro</text><text x="45" y="464" fill="#163349" font-size="18">de pedidos; um sistema específico pode ser ensinado.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>