<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Recrutamento e seleção</text><text x="45" y="140" fill="#163349" font-size="18">Aula 1: Descrição de cargos e perfil da vaga</text><text x="45" y="167" fill="#163349" font-size="18"></text><text x="45" y="194" fill="#163349" font-size="18">Aula 2: Divulgação e canais de recrutamento</text><text x="45" y="221" fill="#163349" font-size="18"></text><text x="45" y="248" fill="#163349" font-size="18">Aula 3: Triagem objetiva de currículos</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">Aula 4: Entrevista estruturada e evidências</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">Aula 5: Decisão, retorno e organização da seleção</text><text x="45" y="383" fill="#163349" font-size="18"></text><text x="45" y="410" fill="#163349" font-size="18">Prática: integrar os cinco assuntos em um caso fictício.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Fixação: 20 questões com correção comentada.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>