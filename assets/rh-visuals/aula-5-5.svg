<svg xmlns="http://www.w3.org/2000/svg" width="900" height="528" viewBox="0 0 900 528"><rect width="900" height="528" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Projeto integrador e melhoria contínua</text><text x="45" y="140" fill="#163349" font-size="18">1. Um projeto integrado de RH reúne: Etapas, responsáveis,</text><text x="45" y="167" fill="#163349" font-size="18">registros e acompanhamento.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. A sequência do PDCA é: Planejar, executar, verificar e agir.</text><text x="45" y="248" fill="#163349" font-size="18"></text><text x="45" y="275" fill="#163349" font-size="18">3. Um relatório deve distinguir: Resultado, hipótese e</text><text x="45" y="302" fill="#163349" font-size="18">pendência.</text><text x="45" y="329" fill="#163349" font-size="18"></text><text x="45" y="356" fill="#163349" font-size="18">4. Depois de testar um checklist, faça: Verificação do resultado</text><text x="45" y="383" fill="#163349" font-size="18">e ajuste.</text><text x="45" y="410" fill="#163349" font-size="18"></text><text x="45" y="437" fill="#163349" font-size="18">Aplicação: Uma empresa quer reduzir falhas de integração; testa</text><text x="45" y="464" fill="#163349" font-size="18">um checklist e compara pendências após duas semanas.</text><text x="45" y="491" fill="#163349" font-size="18"></text></svg>