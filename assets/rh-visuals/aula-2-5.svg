<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582"><rect width="900" height="582" fill="#f3f6fa"/><rect width="900" height="105" fill="#163349"/><text x="40" y="40" fill="white" font-size="23" font-weight="bold">Decisão, retorno e organização da seleção</text><text x="45" y="140" fill="#163349" font-size="18">1. Quem deve autorizar a escolha final? O responsável definido</text><text x="45" y="167" fill="#163349" font-size="18">no processo.</text><text x="45" y="194" fill="#163349" font-size="18"></text><text x="45" y="221" fill="#163349" font-size="18">2. O retorno ao candidato deve preservar: Informações dos demais</text><text x="45" y="248" fill="#163349" font-size="18">participantes.</text><text x="45" y="275" fill="#163349" font-size="18"></text><text x="45" y="302" fill="#163349" font-size="18">3. Antes de prometer a contratação, confira: A aprovação e as</text><text x="45" y="329" fill="#163349" font-size="18">condições autorizadas.</text><text x="45" y="356" fill="#163349" font-size="18"></text><text x="45" y="383" fill="#163349" font-size="18">4. A justificativa da decisão deve considerar: Critérios e</text><text x="45" y="410" fill="#163349" font-size="18">evidências da seleção.</text><text x="45" y="437" fill="#163349" font-size="18"></text><text x="45" y="464" fill="#163349" font-size="18">Aplicação: Dois candidatos fizeram a etapa. O responsável</text><text x="45" y="491" fill="#163349" font-size="18">decide, e o assistente envia mensagens individuais sem divulgar</text><text x="45" y="518" fill="#163349" font-size="18">comparações.</text><text x="45" y="545" fill="#163349" font-size="18"></text></svg>