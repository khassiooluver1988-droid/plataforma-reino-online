<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso • Plataforma Reino</title><link rel="stylesheet" href="assets/styles.css"><style>
.course-shell{max-width:1100px;margin:auto;padding:28px}.course-head{overflow:hidden;padding:0;border-radius:24px;background:var(--surface,#fff);box-shadow:0 12px 40px #0001}.course-hero{position:relative;min-height:320px;display:flex;align-items:flex-end;padding:34px;background:#071a34;color:#fff}.course-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,17,38,.94),rgba(4,17,38,.54),rgba(4,17,38,.15))}.course-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.course-hero-copy{position:relative;z-index:1;max-width:720px}.course-hero-copy>span{font-size:11px;font-weight:900;letter-spacing:.14em;color:#f0cf7a}.course-hero-copy h1{margin:8px 0;font-size:clamp(36px,6vw,62px);line-height:1}.course-hero-copy p{font-size:17px;line-height:1.55}.course-head-body{padding:24px 28px}.course-credit{margin-top:20px;padding:16px 18px;border-radius:16px;background:#071a34;color:#fff}.course-credit strong{display:block;color:#f0cf7a;margin-bottom:5px}.course-credit span{display:block;font-size:13px;line-height:1.5}.lesson{position:relative;overflow:hidden}.lesson-number{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#071a34;color:#fff;font-weight:900;margin-bottom:10px}.lesson:nth-child(even){background:#fbf8ef}.course-test{background:#f7f1df}.refs{background:#f6f8fb}.course-meta{display:flex;gap:10px;flex-wrap:wrap}.course-meta span,.course-progress{padding:8px 12px;border-radius:999px;background:#f1ead8}.course-visual{margin:20px 0;padding:22px;border:1px solid #ddd;border-radius:18px;font-weight:700;text-align:center}.lesson-content-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);gap:22px;align-items:center}.lesson-visual{min-height:190px;border-radius:18px;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#071a34,#164c79);color:#fff;box-shadow:0 12px 30px #071a3420}.lesson-visual svg{width:100%;max-width:300px;height:180px}.topic-illustration{display:grid;place-items:center;gap:14px;text-align:center}.topic-symbol{display:grid;place-items:center;width:104px;height:104px;border-radius:26px;background:rgba(255,255,255,.12);font-size:58px}.topic-illustration strong{max-width:260px;font-size:15px;line-height:1.35;color:#fff}@media(max-width:760px){.lesson-content-grid{grid-template-columns:1fr}.lesson-visual{order:-1}}.lesson{margin:18px 0;padding:22px;border:1px solid #ddd;border-radius:18px}.lesson h2{margin-top:0}.practice{padding:14px;border-left:4px solid #b58b36;background:#faf7ef}.course-test label{display:block;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:12px}.course-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.refs a{display:block;margin:8px 0}.result{font-weight:700;margin:16px 0}@media(max-width:700px){.course-shell{padding:14px}.lesson{padding:18px}.course-hero{min-height:360px;padding:24px 20px}.course-head-body{padding:20px}.course-hero:after{background:linear-gradient(0deg,rgba(4,17,38,.96),rgba(4,17,38,.48))}}

.course-institutional-footer{display:grid;grid-template-columns:1.05fr 1.5fr .7fr;gap:18px;align-items:center;margin:24px 0 8px;padding:18px 20px;border-top:1px solid #e7e2d9;color:#667085;font-size:11px;line-height:1.45}.course-institutional-footer p{margin:0}.course-footer-author span{display:block;margin-bottom:3px;color:#957332;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.course-footer-author p{color:#172033;font-size:12px}.course-footer-description{font-size:10.5px}.course-footer-openlevel{justify-self:end;max-width:150px;text-align:right}.course-footer-openlevel>span{display:inline-block;padding:5px 8px;border:1px solid #d8dce2;border-radius:7px;color:#7a8491;font-size:8px;letter-spacing:.12em}.course-footer-openlevel small{display:block;margin-top:5px;font-size:8px;opacity:.7}@media(max-width:700px){.course-institutional-footer{grid-template-columns:1fr;gap:10px;padding:16px 4px}.course-footer-openlevel{justify-self:start;text-align:left}}
</style><style id="course-identity-overrides">
body[data-course="marketing"] .course-hero{background:linear-gradient(120deg,#071a34,#1769aa)}
body[data-course="vendas"] .course-hero{background:linear-gradient(120deg,#6f4d13,#d7aa46)}
body[data-course="telemarketing"] .course-hero{background:linear-gradient(120deg,#064b48,#13a89e)}
body[data-course="social-media"] .course-hero{background:linear-gradient(120deg,#522080,#d14c9a)}
body[data-course="design"] .course-hero{background:linear-gradient(120deg,#00c4cc,#7d2ae8)}
body[data-course="capcut"] .course-hero{background:linear-gradient(120deg,#111,#3a3a3a)}
.course-hero-bg{opacity:.22;mix-blend-mode:luminosity}
</style>
</head><body><main class="course-shell"><a href="index.html#cursos">← Voltar aos cursos</a><section id="course"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="assets/supabase-config.js"></script><script src="assets/reino-courses.js"></script><script>
const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function visualCaption(courseId,i,title){const labels={marketing:['Objetivo, público e proposta de valor','Jornada do público','Funil: descoberta → consideração → decisão','Campanha: criativo → CTA → resultado','Métricas: medir → comparar → otimizar'],vendas:['Pipeline comercial','Perguntas e diagnóstico','Proposta de valor','Objeções e negociação','Fechamento e pós-venda'],telemarketing:['Comunicação profissional','Roteiro de atendimento','Escuta e registro','Solução e encaminhamento','Qualidade no atendimento'],'social-media':['Posicionamento','Pilares de conteúdo','Calendário editorial','Engajamento e comunidade','Métricas sociais'],design:['Canva e composição','Cor e contraste','Tipografia','Layouts para redes','Exportação'],capcut:['Projeto e cortes','Ritmo e narrativa','Áudio e voz','Legendas e recursos visuais','Exportação para redes']};return labels[courseId]?.[i]||title}
function lessonVisual(courseId,i,title){if(courseId==='marketing'&&i===2)return '<svg viewBox="0 0 320 190" role="img" aria-label="Funil de vendas"><path d="M25 20h270l-35 42H60z" fill="#f0cf7a"/><path d="M60 72h200l-34 40H94z" fill="#d7aa46"/><path d="M94 122h132l-31 38h-70z" fill="#b58b36"/><path d="M145 160h30v25h-30z" fill="#fff"/><text x="160" y="47" text-anchor="middle" font-size="14" font-weight="800" fill="#071a34">DESCOBERTA</text><text x="160" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#071a34">CONSIDERAÇÃO</text><text x="160" y="147" text-anchor="middle" font-size="13" font-weight="800" fill="#071a34">DECISÃO</text></svg>';const symbols={marketing:['🎯','🧭','▽','📣','📊'],vendas:['🪜','🔎','💎','💬','🤝'],telemarketing:['🎧','📝','👂','↗','✓'],'social-media':['📱','🧩','📅','💬','📈'],design:['◫','🎨','Aa','▦','✓'],capcut:['🎬','✂','🎧','CC','▶']};const sym=symbols[courseId]?.[i]||'✦';return '<div class="topic-illustration"><span class="topic-symbol" aria-hidden="true">'+sym+'</span><strong>'+esc(visualCaption(courseId,i,title))+'</strong></div>'}
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const id=new URLSearchParams(location.search).get('id');const c=window.REINO_COURSES.find(x=>x.id===id);const root=document.getElementById('course');
if(!c){root.innerHTML='<div class="course-head"><h1>Curso indisponível</h1><p>Este curso não foi encontrado.</p></div>'}
else{document.body.dataset.course=c.id;document.title=c.title+' • Plataforma Reino';const randomizedTest=shuffle(c.test).map(q=>{const options=shuffle(q[1].map((text,index)=>({text,index})));return {question:q[0],options,correct:q[2]}});const courseImages={marketing:'assets/banner-cursos.webp',vendas:'assets/categoria-informativo.webp',telemarketing:'assets/capa-comunidade-rede.webp','social-media':'assets/capa-comunidade-rede.webp',design:'assets/banner-cursos.webp',capcut:'assets/banner-cursos.webp'};const heroImage=courseImages[c.id]||'assets/banner-cursos.webp';root.innerHTML=`<header class="course-head"><div class="course-hero"><img class="course-hero-bg" src="${heroImage}" alt="" aria-hidden="true"><div class="course-hero-copy"><span>FORMAÇÃO REINO • CURSO INTERATIVO</span><h1>${esc(c.title)}</h1><p>${esc(c.goal)}</p></div></div><div class="course-head-body"><div class="course-meta"><span>5 horas</span><span>5 módulos</span><span>Exercícios práticos</span><span>Teste final</span></div><div class="course-visual">${esc(c.visual)}</div><p><b>Metodologia:</b> aprender → observar exemplo → aplicar → praticar → revisar → testar.</p><div class="course-credit"><strong>CONTEÚDO AUTORAL</strong><span>Desenvolvido por Khassio Silva • Estrategista de Marketing • Plataforma Reino</span><span>Engaja Marketing Estratégico • Open Level</span></div></div></header>
<div class="course-actions"><button class="button navy" id="start">Iniciar curso</button><span class="course-progress" id="progress">0/5 módulos concluídos</span></div>
<div id="lessons">${c.modules.map((m,i)=>`<article class="lesson"><span class="lesson-number">${i+1}</span><small>MÓDULO ${i+1} • ${esc(m[1])}</small><h2>${esc(m[0])}</h2><div class="lesson-content-grid"><div><p>${esc(m[2])}</p><p><b>Aplicação do dia a dia:</b> ${esc(m[3])}</p><div class="practice"><b>Exercício prático</b><p>${esc(m[4])}</p></div></div><div class="lesson-visual" aria-label="Ilustração didática do módulo">${lessonVisual(c.id,i,m[0])}<small>${esc(visualCaption(c.id,i,m[0]))}</small></div></div><label><input type="checkbox" data-done="${i}"> Marcar módulo como concluído</label></article>`).join('')}</div>
<section class="lesson course-test"><h2>Teste final</h2><p>Responda às 5 questões. Para aprovação nesta atividade de revisão, acerte pelo menos 4.</p><form id="test">${randomizedTest.map((q,qi)=>`<fieldset><legend>${qi+1}. ${esc(q.question)}</legend>${q.options.map(o=>`<label><input type="radio" name="q${qi}" value="${o.index}" required> ${esc(o.text)}</label>`).join('')}</fieldset>`).join('')}<button class="button gold" type="submit">Corrigir teste</button><p class="result" id="result" role="status"></p><div id="certificate-action" class="course-actions" hidden><button class="button navy" type="button" id="issue-certificate">Emitir certificado</button></div><p class="result" id="certificate-message" role="status"></p></form></section>
<section class="lesson refs"><h2>Referências e aprofundamento</h2><p>Conteúdo autoral da Plataforma Reino estruturado a partir de fundamentos profissionais e fontes educacionais. Consulte as fontes para aprofundar.</p>${c.refs.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener noreferrer">${esc(r[0])} ↗</a>`).join('')}</section>
<footer class="course-institutional-footer" aria-label="Autoria e desenvolvimento do curso"><div class="course-footer-author"><span>Autoria e desenvolvimento</span><p>Engaja Marketing • Khassio Silva — Especialista em Marketing</p></div><p class="course-footer-description">Organização, estruturação, diagramação e automação dos cursos, com desenvolvimento da grade e carga horária para aplicação na Plataforma Reino.</p><div class="course-footer-openlevel"><span>OPEN LEVEL</span><small>Selo oficial e frase de aprovação serão exibidos após comprovação oficial.</small></div></footer>`;
const key='reino_course_'+c.id;const saved=JSON.parse(localStorage.getItem(key)||'{"done":[]}');const boxes=[...document.querySelectorAll('[data-done]')];boxes.forEach((b,i)=>b.checked=saved.done.includes(i));
let currentUser=null;
async function syncProgress(extra={}){const client=window.REINO_SUPABASE;if(!client||!currentUser)return;const done=boxes.filter(b=>b.checked).length;const local=JSON.parse(localStorage.getItem(key)||'{}');const payload={user_id:currentUser.id,course_id:c.id,progress:done===5&&local.passed?100:Math.round(done*20),completed_modules:done,final_score:Number.isInteger(local.score)?local.score:null,passed:!!local.passed,updated_at:new Date().toISOString(),...extra};if(payload.progress===100)payload.completed_at=new Date().toISOString();await client.from('course_progress').upsert(payload,{onConflict:'user_id,course_id'});}
function refreshCertificateAction(){const data=JSON.parse(localStorage.getItem(key)||'{}');const done=boxes.filter(b=>b.checked).length;document.getElementById('certificate-action').hidden=!(currentUser&&done===5&&data.passed);}
async function paint(){const done=boxes.map((b,i)=>b.checked?i:null).filter(x=>x!==null);const data=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...data,done}));document.getElementById('progress').textContent=done.length+'/5 módulos concluídos';refreshCertificateAction();await syncProgress();}
boxes.forEach(b=>b.addEventListener('change',paint));document.getElementById('start').onclick=()=>document.querySelector('.lesson')?.scrollIntoView({behavior:'smooth'});
(async()=>{const client=window.REINO_SUPABASE;if(!client){paint();return}const auth=await client.auth.getUser();currentUser=auth.data.user||null;if(currentUser){const db=await client.from('course_progress').select('completed_modules,final_score,passed').eq('user_id',currentUser.id).eq('course_id',c.id).maybeSingle();if(db.data){for(let i=0;i<Math.min(db.data.completed_modules||0,5);i++)boxes[i].checked=true;const data=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...data,score:db.data.final_score,passed:db.data.passed}));}}paint();})();
document.getElementById('test').onsubmit=async e=>{e.preventDefault();let score=0;randomizedTest.forEach((q,i)=>{if(Number(new FormData(e.currentTarget).get('q'+i))===q.correct)score++});const pass=score>=4;const data=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...data,score,passed:pass}));document.getElementById('result').textContent=`Resultado: ${score}/5 — ${pass?'Aprovado na revisão final.':'Revise os módulos e tente novamente.'}`;await syncProgress();refreshCertificateAction();};
document.getElementById('issue-certificate').onclick=async()=>{const msg=document.getElementById('certificate-message');if(!currentUser){msg.textContent='Entre na sua conta para emitir o certificado.';return}msg.textContent='Emitindo certificado…';const result=await window.REINO_SUPABASE.rpc('issue_course_certificate',{p_course_id:c.id});if(result.error){msg.textContent=result.error.message.includes('profile full name')?'Complete seu nome no perfil antes de emitir o certificado.':'Ainda não foi possível emitir. Confirme 5/5 módulos e aprovação no teste.';return}location.href='certificate.html?id='+encodeURIComponent(result.data);};
}</script></body></html>
