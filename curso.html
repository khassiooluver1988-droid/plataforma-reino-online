<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso • Plataforma Reino</title><link rel="stylesheet" href="assets/styles.css"><style>
.course-shell{max-width:1100px;margin:auto;padding:28px}.course-head{padding:28px;border-radius:24px;background:var(--surface,#fff);box-shadow:0 12px 40px #0001}.course-meta{display:flex;gap:10px;flex-wrap:wrap}.course-meta span,.course-progress{padding:8px 12px;border-radius:999px;background:#f1ead8}.course-visual{margin:20px 0;padding:22px;border:1px solid #ddd;border-radius:18px;font-weight:700;text-align:center}.lesson{margin:18px 0;padding:22px;border:1px solid #ddd;border-radius:18px}.lesson h2{margin-top:0}.practice{padding:14px;border-left:4px solid #b58b36;background:#faf7ef}.course-test label{display:block;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:12px}.course-actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.refs a{display:block;margin:8px 0}.result{font-weight:700;margin:16px 0}@media(max-width:700px){.course-shell{padding:14px}.course-head,.lesson{padding:18px}}
</style></head><body><main class="course-shell"><a href="index.html#cursos">← Voltar aos cursos</a><section id="course"></section></main><script src="assets/reino-courses.js"></script><script>
const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const id=new URLSearchParams(location.search).get('id');const c=window.REINO_COURSES.find(x=>x.id===id);const root=document.getElementById('course');
if(!c){root.innerHTML='<div class="course-head"><h1>Curso indisponível</h1><p>Este curso não foi encontrado.</p></div>'}
else{document.title=c.title+' • Plataforma Reino';root.innerHTML=`<header class="course-head"><span>FORMAÇÃO REINO</span><h1>${esc(c.title)}</h1><p>${esc(c.goal)}</p><div class="course-meta"><span>5 horas</span><span>5 módulos</span><span>Exercícios práticos</span><span>Teste final</span></div><div class="course-visual">${esc(c.visual)}</div><p><b>Metodologia:</b> aprender → observar exemplo → aplicar → praticar → revisar → testar.</p></header>
<div class="course-actions"><button class="button navy" id="start">Iniciar curso</button><span class="course-progress" id="progress">0/5 módulos concluídos</span></div>
<div id="lessons">${c.modules.map((m,i)=>`<article class="lesson"><small>MÓDULO ${i+1} • ${esc(m[1])}</small><h2>${esc(m[0])}</h2><p>${esc(m[2])}</p><p><b>Aplicação do dia a dia:</b> ${esc(m[3])}</p><div class="practice"><b>Exercício prático</b><p>${esc(m[4])}</p></div><label><input type="checkbox" data-done="${i}"> Marcar módulo como concluído</label></article>`).join('')}</div>
<section class="lesson course-test"><h2>Teste final</h2><p>Responda às 5 questões. Para aprovação nesta atividade de revisão, acerte pelo menos 4.</p><form id="test">${c.test.map((q,qi)=>`<fieldset><legend>${qi+1}. ${esc(q[0])}</legend>${q[1].map((o,oi)=>`<label><input type="radio" name="q${qi}" value="${oi}" required> ${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="button gold" type="submit">Corrigir teste</button><p class="result" id="result" role="status"></p></form></section>
<section class="lesson refs"><h2>Referências e aprofundamento</h2><p>Conteúdo autoral da Plataforma Reino estruturado a partir de fundamentos profissionais e fontes educacionais. Consulte as fontes para aprofundar.</p>${c.refs.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener noreferrer">${esc(r[0])} ↗</a>`).join('')}</section>`;
const key='reino_course_'+c.id;const saved=JSON.parse(localStorage.getItem(key)||'{"done":[]}');const boxes=[...document.querySelectorAll('[data-done]')];boxes.forEach((b,i)=>b.checked=saved.done.includes(i));
function paint(){const done=boxes.map((b,i)=>b.checked?i:null).filter(x=>x!==null);localStorage.setItem(key,JSON.stringify({...saved,done}));document.getElementById('progress').textContent=done.length+'/5 módulos concluídos'}
boxes.forEach(b=>b.addEventListener('change',paint));paint();document.getElementById('start').onclick=()=>document.querySelector('.lesson')?.scrollIntoView({behavior:'smooth'});
document.getElementById('test').onsubmit=e=>{e.preventDefault();let score=0;c.test.forEach((q,i)=>{if(Number(new FormData(e.currentTarget).get('q'+i))===q[2])score++});const pass=score>=4;const data=JSON.parse(localStorage.getItem(key)||'{}');localStorage.setItem(key,JSON.stringify({...data,score,passed:pass}));document.getElementById('result').textContent=`Resultado: ${score}/5 — ${pass?'Aprovado na revisão final.':'Revise os módulos e tente novamente.'}`};
}</script></body></html>
